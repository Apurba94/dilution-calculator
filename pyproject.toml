[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dilution-calculator"
version = "0.1.0"
description = "C1V1=C2V2, serial dilution series and molarity/mass calculations."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "JANIN A APURBA", email = "japurba97@gmail.com"}]
keywords = ["research", "automation", "reproducibility", "academic"]
dependencies = []

[project.scripts]
dilution-calculator = "dilution_calculator.cli:main"

[tool.setuptools]
packages = ["dilution_calculator"]
